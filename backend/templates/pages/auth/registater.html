{% extends 'layouts/main.html' %}

{% block title %}
signup
{% endblock %}

{% block add_head %}
<style>
    @keyframes blob {

        0%,
        100% {
            transform: translate(0, 0) scale(1);
        }

        33% {
            transform: translate(30px, -50px) scale(1.1);
        }

        66% {
            transform: translate(-20px, 20px) scale(0.9);
        }
    }

    .animate-blob {
        animation: blob 7s infinite;
    }

    .animation-delay-2000 {
        animation-delay: 2s;
    }

    .animation-delay-4000 {
        animation-delay: 4s;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .animate-spin {
        animation: spin 1s linear infinite;
    }
</style>
{% endblock %}

{% block main_container %}
<div class="light-mode">
    <div
        class="min-h-screen flex items-center justify-center px-4 py-8 transition-colors duration-500 bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50">

        <!-- Animated background orbs -->
        <div class="fixed inset-0 overflow-hidden pointer-events-none">
            <div
                class="absolute top-20 left-20 w-72 h-72 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob bg-purple-400">
            </div>
            <div
                class="absolute top-40 right-20 w-72 h-72 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000 bg-blue-400">
            </div>
            <div
                class="absolute bottom-20 left-1/2 w-72 h-72 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000 bg-pink-400">
            </div>
        </div>

        <!-- Main container -->
        <div class="relative w-full max-w-md z-10">

            <!-- Dark mode toggle -->
            <div class="absolute top-0 right-0 -mt-16 flex items-center gap-2">
                <button onclick="toggleDarkMode()"
                    class="relative inline-flex h-8 w-14 items-center rounded-full transition-colors bg-gray-300">
                    <span
                        class="toggle-circle inline-block h-6 w-6 transform rounded-full bg-white transition-transform translate-x-1"></span>
                </button>
                <span class="toggle-emoji text-sm font-medium text-gray-600">☀️</span>
            </div>

            <!-- Glassmorphism Card -->
            <div
                class="glass-card backdrop-blur-xl rounded-3xl border transition-all duration-500 shadow-2xl bg-white/40 border-white/60 shadow-purple-200/30 p-8 md:p-10">

                <!-- Header -->
                <div class="mb-8 text-center">
                    <div
                        class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 bg-gradient-to-br from-purple-400 to-pink-400">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                        </svg>
                    </div>

                    <h1 class="text-3xl md:text-4xl font-bold mb-2 text-gray-900">
                        Create Account
                    </h1>
                    <p class="text-gray-600">
                        Join us today and unlock amazing features
                    </p>
                </div>
        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}
                <!-- Form -->
                <form action="/signup" method="post" id="signupForm" class="space-y-5">

                    <!-- Full Name -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700">
                            Full Name
                        </label>
                        <input type="text" name="name" placeholder="John Doe"
                            class="w-full px-4 py-3 rounded-xl backdrop-blur-sm transition-all border bg-white/50 border-white/60 text-gray-900 placeholder-gray-500 focus:bg-white/70 focus:border-purple-400/50 focus:ring-2 focus:ring-purple-400/20 outline-none" value="{{ form_data.name if form_data else '' }}"
                            required />
                        <span class="error-text text-red-500 text-sm mt-1 hidden flex items-center gap-1"></span>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700">
                            Email Address
                        </label>
                        <input type="email" name="email" placeholder="you@example.com"
                            class="w-full px-4 py-3 rounded-xl backdrop-blur-sm transition-all border bg-white/50 border-white/60 text-gray-900 placeholder-gray-500 focus:bg-white/70 focus:border-purple-400/50 focus:ring-2 focus:ring-purple-400/20 outline-none" value="{{ form_data.email if form_data else '' }}"
                            required />
                        <span class="error-text text-red-500 text-sm mt-1 hidden flex items-center gap-1"></span>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700">
                            Password
                        </label>
                        <div class="relative">
                            <input type="password" name="password" placeholder="••••••••"
                                class="w-full px-4 py-3 rounded-xl backdrop-blur-sm transition-all border bg-white/50 border-white/60 text-gray-900 placeholder-gray-500 focus:bg-white/70 focus:border-purple-400/50 focus:ring-2 focus:ring-purple-400/20 outline-none pr-10"
                                required />
                            <button type="button" onclick="togglePasswordVisibility(this)"
                                class="absolute right-3 top-1/2 -translate-y-1/2 transition-colors text-gray-500 hover:text-gray-700 cursor-pointer">
                                👁️‍🗨️
                            </button>
                        </div>
                        <span class="error-text text-red-500 text-sm mt-1 hidden flex items-center gap-1"></span>
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700">
                            Confirm Password
                        </label>
                        <div class="relative">
                            <input type="password" name="re_password" placeholder="••••••••"
                                class="w-full px-4 py-3 rounded-xl backdrop-blur-sm transition-all border bg-white/50 border-white/60 text-gray-900 placeholder-gray-500 focus:bg-white/70 focus:border-purple-400/50 focus:ring-2 focus:ring-purple-400/20 outline-none pr-10"
                                required />
                            <button type="button" onclick="togglePasswordVisibility(this)"
                                class="absolute right-3 top-1/2 -translate-y-1/2 transition-colors text-gray-500 hover:text-gray-700 cursor-pointer">
                                👁️‍🗨️
                            </button>
                        </div>
                        <span class="error-text text-red-500 text-sm mt-1 hidden flex items-center gap-1"></span>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submitBtn"
                        class="w-full py-3 px-6 rounded-xl font-semibold text-white transition-all duration-300 transform hover:scale-105 active:scale-95 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 shadow-lg shadow-purple-300/50 disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:scale-100 flex items-center justify-center gap-2">
                        Sign Up
                        <span>→</span>
                    </button>

                    <!-- Divider -->
                    <div class="flex items-center gap-3">
                        <div class="flex-1 h-px bg-white/30"></div>
                        <span class="text-sm text-gray-600">or</span>
                        <div class="flex-1 h-px bg-white/30"></div>
                    </div>

                    <!-- Social Buttons -->
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button"
                            class="py-3 px-4 rounded-xl font-medium transition-all border bg-white/30 border-white/40 text-gray-900 hover:bg-white/50">
                            <span class="text-lg">Google</span>
                        </button>
                        <button type="button"
                            class="py-3 px-4 rounded-xl font-medium transition-all border bg-white/30 border-white/40 text-gray-900 hover:bg-white/50">
                            <span class="text-lg">GitHub</span>
                        </button>
                    </div>
                </form>

                <!-- Footer -->
                <p class="text-center text-sm mt-8 text-gray-600">
                    Already have an account?
                    <a href="/login" class="font-semibold text-purple-600 hover:text-purple-700 transition-colors">
                        Sign In
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility(button) {
        const input = button.previousElementSibling;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        button.textContent = isPassword ? '👁️' : '👁️‍🗨️';
    }
</script>
{% endblock %}
